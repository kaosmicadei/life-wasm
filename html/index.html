<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life in WASM</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(33, 26, 56);
      }
      canvas {
        width: 600px;
        height: 600px;
        image-rendering: pixelated;
      }
    </style>
</head>
<body>
  <canvas id="game-of-life"></canvas>

  <script type="module">
    const { instance } = await WebAssembly.instantiateStreaming(fetch('./life.wasm'));
    const init = instance.exports.init;
    const update = instance.exports.update;

    const width = 32;   // canvas width in cells
    const height = 32;  // canvas height in cells
    
    // For zero-copy access, we use two buffer to hold the state of the game: one for the current
    // state and one for the next state.
    const memory = new Uint8Array(instance.exports.memory.buffer, 0, 2 * width * height);
    window.memory = memory;
    const canvas = document.getElementById('game-of-life');
    const ctx = canvas.getContext('2d');

    canvas.width = width
    canvas.height = height

    const imageData = ctx.createImageData(width, height);
    const pixels = imageData.data;

    function render(addr) {
      for (let i = 0; i < width * height; i++) {
        const cell = memory[addr + i];
        const color = cell ? 255 : 0;
        const pixelIndex = i * 4;
        pixels[pixelIndex] = color;
        pixels[pixelIndex + 1] = color;
        pixels[pixelIndex + 2] = color;
        pixels[pixelIndex + 3] = 255;
      }
      ctx.putImageData(imageData, 0, 0);
    }

    let currAddr = init();
    render(currAddr);
    setInterval(() => {
      currAddr = update(currAddr);
      render(currAddr);
    }, 100);
  </script>
</body>
</html>
